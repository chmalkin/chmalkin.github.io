
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AVENGERS: DOOMSDAY | Official Trailer (2026) | Marvel Studios</title>

  <!-- Google Messages thumbnail -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Marvel Studios">
  <meta property="og:title" content="AVENGERS: DOOMSDAY | Official Trailer (2026) | Marvel Studios">
  <meta property="og:description" content="The countdown to Doomsday begins. Watch the official trailer.">
  <meta property="og:url" content="https://chmalkin.github.io/doomsday/">
  <meta property="og:image" content="https://chmalkin.github.io/doomsday/thumbnail.jpg">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="720">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AVENGERS: DOOMSDAY | Official Trailer">
  <meta name="twitter:image" content="https://chmalkin.github.io/doomsday/thumbnail.jpg">

  <style>
    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 40px 15px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 55px);
      letter-spacing: 3px;
      color: #c51e2f;
    }

    p {
      color: #aaa;
      letter-spacing: 3px;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      margin-top: 30px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #playButton {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      color: white;
      font-size: 65px;
      text-shadow: 0 0 20px black;
    }

    #playButton span {
      display: inline-block;
      background: #c51e2f;
      border-radius: 50%;
      padding: 10px 25px;
    }
  </style>
</head>

<body>
  <main>
    <h1>AVENGERS: DOOMSDAY</h1>
    <p>OFFICIAL TRAILER</p>

    <div class="video-container">
      <video id="trailer"
             poster="thumbnail.jpg"
             playsinline
             preload="metadata">
        <source src="trailer.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>

      <button id="playButton" onclick="playTrailer()">
        <span>▶</span>
      </button>
    </div>
  </main>

  <script>
    function playTrailer() {
      const video = document.getElementById("trailer");
      const button = document.getElementById("playButton");

      video.muted = false;
      video.controls = true;

      video.play().then(() => {
        button.style.display = "none";
      }).catch(error => {
        console.error("Video playback failed:", error);
      });
    }
  </script>
</body>
</html>
