<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>KMML Pregame Slideshow</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      cursor: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.2s ease;
      background: #000;
    }

    .slide.show {
      opacity: 1;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0,0,0,.55);
      color: rgba(255,255,255,.75);
      font: 14px Arial, sans-serif;
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
    }

    body:hover #hint {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="a" class="slide" alt="">
    <img id="b" class="slide" alt="">
  </div>
  <div id="hint">Click for fullscreen</div>

  <script src="photos.js"></script>
  <script>
    const DISPLAY_MS = 8000;

    function shuffle(items) {
      const a = items.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const photos = shuffle(window.KMML_PHOTOS || []);
    const a = document.getElementById("a");
    const b = document.getElementById("b");

    let active = a;
    let standby = b;
    let index = 0;

    function showNext() {
      if (!photos.length) return;

      standby.src = photos[index];
      standby.onload = () => {
        standby.classList.add("show");
        active.classList.remove("show");

        const tmp = active;
        active = standby;
        standby = tmp;

        index = (index + 1) % photos.length;

        if (photos.length > 1) {
          const preload = new Image();
          preload.src = photos[index];
        }
      };
    }

    if (photos.length) {
      active.src = photos[0];
      active.onload = () => {
        active.classList.add("show");
        index = photos.length > 1 ? 1 : 0;
        setInterval(showNext, DISPLAY_MS);
      };
    }

    document.addEventListener("click", () => {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
